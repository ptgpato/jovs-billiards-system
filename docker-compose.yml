services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: jovsdb
      DB_USER: jovs
      DB_PASSWORD: jovs-local-password
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jovsdb
      MYSQL_USER: jovs
      MYSQL_PASSWORD: jovs-local-password
      MYSQL_ROOT_PASSWORD: jovs-local-root-password
    volumes:
      - jovs-db-data:/var/lib/mysql
      - ./jovsdb.sql:/docker-entrypoint-initdb.d/01-jovsdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  jovs-db-data:
